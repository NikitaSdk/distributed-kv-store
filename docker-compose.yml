version: "3.9"

services:

  coordinator:
    build: .
    container_name: coordinator
    ports:
      - "8000:8000"
    environment:
      - MODE=coordinator
    networks:
      - kv-net


  shard1-leader:
    build: .
    container_name: shard1-leader
    ports:
      - "8001:8000"
    environment:
      - MODE=shard
      - SHARD_ID=shard1
      - ROLE=leader
      - COORDINATOR_URL=http://coordinator:8000
      - SHARD_ADDRESS=http://shard1-leader:8000
    networks:
      - kv-net

  shard1-follower1:
    build: .
    container_name: shard1-follower1
    ports:
      - "8002:8000"
    environment:
      - MODE=shard
      - SHARD_ID=shard1
      - ROLE=follower
      - COORDINATOR_URL=http://coordinator:8000
      - SHARD_ADDRESS=http://shard1-follower1:8000
      - LEADER_ADDRESS=http://shard1-leader:8000
    volumes:
      - shard1-follower1-data:/data
    networks:
      - kv-net

  shard1-follower2:
    build: .
    container_name: shard1-follower2
    ports:
      - "8003:8000"
    environment:
      - MODE=shard
      - SHARD_ID=shard1
      - ROLE=follower
      - COORDINATOR_URL=http://coordinator:8000
      - SHARD_ADDRESS=http://shard1-follower2:8000
      - LEADER_ADDRESS=http://shard1-leader:8000
    volumes:
      - shard1-follower2-data:/data
    networks:
      - kv-net



  shard2-leader:
    build: .
    container_name: shard2-leader
    ports:
      - "8004:8000"
    environment:
      - MODE=shard
      - SHARD_ID=shard2
      - ROLE=leader
      - COORDINATOR_URL=http://coordinator:8000
      - SHARD_ADDRESS=http://shard2-leader:8000
    networks:
      - kv-net

  shard2-follower1:
    build: .
    container_name: shard2-follower1
    ports:
      - "8005:8000"
    environment:
      - MODE=shard
      - SHARD_ID=shard2
      - ROLE=follower
      - COORDINATOR_URL=http://coordinator:8000
      - SHARD_ADDRESS=http://shard2-follower1:8000
      - LEADER_ADDRESS=http://shard2-leader:8000
    volumes:
      - shard2-follower1-data:/data
    networks:
      - kv-net

  shard2-follower2:
    build: .
    container_name: shard2-follower2
    ports:
      - "8006:8000"
    environment:
      - MODE=shard
      - SHARD_ID=shard2
      - ROLE=follower
      - COORDINATOR_URL=http://coordinator:8000
      - SHARD_ADDRESS=http://shard2-follower2:8000
      - LEADER_ADDRESS=http://shard2-leader:8000
    volumes:
      - shard2-follower2-data:/data
    networks:
      - kv-net


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - coordinator
    networks:
      - kv-net


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - kv-net


  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n:5678
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - grafana
    networks:
      - kv-net


networks:
  kv-net:
    driver: bridge


volumes:
  shard1-follower1-data:
  shard1-follower2-data:
  shard2-follower1-data:
  shard2-follower2-data:
  n8n_data:
